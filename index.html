<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎂 生日快乐，渊！ 🎂</title>
  <style>
    /* 全局重置 & 字体 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #1e1a2b 0%, #2a1e3c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 1rem;
    }

    /* 飘浮爱心 — 移动端精简数量 + 移除 drop-shadow */
    .floating-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      color: rgba(255, 200, 220, 0.7);
      font-size: 1.2rem;
      user-select: none;
      animation: floatUp 12s infinite ease-in-out;
      will-change: transform, opacity;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.4; }
      50% { transform: translateY(-35vh) rotate(12deg); opacity: 0.8; }
      100% { transform: translateY(-80vh) rotate(-8deg); opacity: 0; }
    }

    /* 主卡片 — 移除毛玻璃 backdrop-filter（移动端性能杀手） */
    .birthday-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 680px;
      background: rgba(48, 32, 65, 0.85);
      border: 2px solid rgba(255, 220, 240, 0.28);
      border-radius: 50px 50px 40px 40px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 190, 220, 0.15) inset;
      padding: 2rem 1.5rem 1.8rem;
      text-align: center;
      animation: cardGlow 5s infinite alternate;
    }

    @keyframes cardGlow {
      0% { box-shadow: 0 12px 25px rgba(255, 100, 150, 0.2), 0 0 0 1px rgba(255, 210, 240, 0.25) inset; }
      100% { box-shadow: 0 22px 45px rgba(255, 150, 200, 0.4), 0 0 0 2px rgba(255, 240, 250, 0.45) inset; }
    }

    /* 装饰彩带 */
    .ribbon {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .ribbon span {
      width: 13px;
      height: 13px;
      border-radius: 50%;
    }

    .ribbon span:nth-child(1) { background: #ff9aa2; box-shadow: 0 0 6px #ff9aa2; }
    .ribbon span:nth-child(2) { background: #ffb7b2; box-shadow: 0 0 6px #ffb7b2; }
    .ribbon span:nth-child(3) { background: #ffdac1; box-shadow: 0 0 6px #ffdac1; }
    .ribbon span:nth-child(4) { background: #e2f0cb; box-shadow: 0 0 6px #e2f0cb; }
    .ribbon span:nth-child(5) { background: #b5ead7; box-shadow: 0 0 6px #b5ead7; }
    .ribbon span:nth-child(6) { background: #c7ceea; box-shadow: 0 0 6px #c7ceea; }

    /* 标题行 */
    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.2rem 0.6rem;
      margin-bottom: 0.3rem;
      padding: 0.3rem 0;
    }

    h1 {
      font-size: clamp(1.8rem, 8vw, 3rem);
      font-weight: 800;
      color: #fff0f5;
      text-shadow: 0 0 12px #ff99cc, 0 0 25px #ff66aa;
      letter-spacing: 2px;
      animation: titlePulse 3s infinite alternate;
      line-height: 1.3;
      margin: 0;
      display: inline-block;
      position: relative;
    }

    /* 简化装饰线（移动端更容易渲染） */
    h1::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 15%;
      width: 70%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ffb8d0, transparent);
      border-radius: 2px;
      opacity: 0.6;
    }

    @keyframes titlePulse {
      from { text-shadow: 0 0 12px #ff99cc, 0 0 25px #ff66aa; }
      to { text-shadow: 0 0 20px #ffaacc, 0 0 40px #ff5599; }
    }

    .friend-name {
      display: inline-block;
      background: linear-gradient(135deg, #ffe6b0, #ffc3d0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: clamp(1.9rem, 9vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 4px;
      filter: drop-shadow(0 0 6px rgba(255, 180, 210, 0.7));
    }

    .friend-name::before,
    .friend-name::after {
      content: '✦';
      font-size: 0.5em;
      color: #ffc8dd;
      -webkit-text-fill-color: #ffc8dd;
      margin: 0 0.1em;
    }

    /* 祝福语 */
    .message {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 30px;
      padding: 1.2rem 1rem;
      margin: 1.2rem 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .message p {
      font-size: clamp(0.95rem, 3.8vw, 1.15rem);
      color: #ffeff5;
      line-height: 1.9;
      word-break: break-word;
    }

    .message p i {
      font-style: normal;
      display: inline-block;
      animation: wink 2.5s infinite;
    }

    @keyframes wink {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }

    /* 蛋糕区域 — 增加上边距避免火焰与文字重叠 */
    .cake-section {
      margin: 2rem 0 0.8rem;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 0.5rem;
    }

    .cake {
      position: relative;
      width: 165px;
      height: 125px;
      cursor: pointer;
      transition: transform 0.15s;
      user-select: none;
      -webkit-user-select: none;
    }

    .cake:active {
      transform: scale(0.96);
    }

    /* 蛋糕底座 */
    .cake-base {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 68px;
      background: linear-gradient(180deg, #d47a5a, #a34d30);
      border-radius: 0 0 18px 18px;
      box-shadow: 0 8px 0 #6d2e1a;
      border-bottom: 3px solid #54210f;
    }

    /* 蛋糕中间层 */
    .cake-mid {
      position: absolute;
      bottom: 58px;
      left: 5%;
      width: 90%;
      height: 38px;
      background: linear-gradient(180deg, #ffdbb5, #e6b082);
      border-radius: 12px 12px 4px 4px;
      border-bottom: 3px solid #b17a52;
      box-shadow: 0 4px 0 #b17a52;
    }

    /* 蛋糕顶层 */
    .cake-top {
      position: absolute;
      bottom: 92px;
      left: 12%;
      width: 76%;
      height: 28px;
      background: radial-gradient(circle at 30% 20%, #fff9f0, #f7d9b8);
      border-radius: 25px 25px 6px 6px;
      border-bottom: 2px solid #d49c6c;
    }

    /* 小糖粒 */
    .sprinkles {
      position: absolute;
      bottom: 96px;
      left: 20%;
      width: 60%;
      height: 18px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
    }

    .sprinkles span {
      width: 5px;
      height: 5px;
      border-radius: 2px;
      transform: rotate(45deg);
      margin: 2px;
    }

    .sprinkles span:nth-child(1) { background: #ff4d6d; }
    .sprinkles span:nth-child(2) { background: #ffb347; }
    .sprinkles span:nth-child(3) { background: #6a4c9c; }
    .sprinkles span:nth-child(4) { background: #4caf7a; }
    .sprinkles span:nth-child(5) { background: #ff7b9c; }
    .sprinkles span:nth-child(6) { background: #ffd93d; }

    /* 蜡烛 */
    .candle {
      position: absolute;
      bottom: 118px;
      left: 50%;
      transform: translateX(-50%);
      width: 13px;
      height: 42px;
      background: repeating-linear-gradient(45deg, #fdd, #fdd 5px, #fbb 5px, #fbb 10px);
      border-radius: 5px 5px 3px 3px;
      box-shadow: 0 0 6px #ffccaa;
      z-index: 5;
      cursor: pointer;
    }

    .candle.extinguished {
      background: repeating-linear-gradient(45deg, #999, #999 5px, #777 5px, #777 10px);
      box-shadow: 0 0 3px #666;
    }

    /* 火焰 — 简化 box-shadow 减少 GPU 压力 */
    .flame {
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 26px;
      background: radial-gradient(circle at 50% 20%, #ffdd44, #ff8800 70%, #ff4400);
      border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
      box-shadow: 0 0 18px #ffaa00, 0 0 30px #ff6600;
      animation: flicker 0.3s infinite alternate;
      z-index: 6;
    }

    .flame.hidden {
      opacity: 0;
      animation: none;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(0.92) rotate(-2deg); }
      100% { transform: translateX(-50%) scale(1.08) rotate(2deg); }
    }

    /* 提示文字 */
    .hint {
      font-size: 0.8rem;
      color: #ffe2f0;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.35rem 1rem;
      border-radius: 50px;
      margin-top: 0.6rem;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: opacity 0.3s;
    }

    /* 按钮区 */
    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin: 1.2rem 0 0.3rem;
      flex-wrap: wrap;
    }

    .btn {
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 220, 240, 0.6);
      color: #fff0f5;
      padding: 0.7rem 1.6rem;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn:hover {
      background: rgba(255, 180, 210, 0.35);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-music {
      background: rgba(255, 200, 220, 0.2);
      border-color: #ffb8d0;
    }

    .btn-music.playing {
      background: rgba(255, 150, 180, 0.45);
      box-shadow: 0 0 15px rgba(255, 100, 150, 0.5);
      animation: musicPulse 1s infinite alternate;
    }

    @keyframes musicPulse {
      from { box-shadow: 0 0 10px rgba(255, 100, 150, 0.4); }
      to { box-shadow: 0 0 22px rgba(255, 100, 150, 0.8); }
    }

    /* 底部小字 */
    .footer-note {
      color: #ffc0d0;
      margin-top: 1.3rem;
      font-size: 0.8rem;
      opacity: 0.75;
      border-top: 1px solid rgba(255, 200, 220, 0.25);
      padding-top: 0.9rem;
    }

    /* 响应式 */
    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
      }

      .birthday-card {
        padding: 1.5rem 1rem 1.3rem;
        border-radius: 35px 35px 30px 30px;
      }

      .cake {
        transform: scale(0.85);
      }

      .btn {
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
      }

      .ribbon span {
        width: 11px;
        height: 11px;
      }

      .title-row {
        gap: 0.1rem 0.4rem;
      }

      h1 {
        letter-spacing: 1.5px;
      }

      .friend-name {
        letter-spacing: 3px;
      }

      .cake-section {
        margin-top: 1.6rem;
      }

      .message {
        padding: 1rem 0.8rem;
      }
    }

    /* 撒花 */
    .confetti {
      position: fixed;
      top: -20px;
      width: 7px;
      height: 7px;
      opacity: 0.9;
      z-index: 999;
      pointer-events: none;
      animation: confettiFall 3s linear forwards;
      will-change: transform;
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(540deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- 飘浮爱心背景 -->
  <div class="floating-hearts" id="heartContainer"></div>

  <!-- 主卡片 -->
  <div class="birthday-card">
    <!-- 彩色圆点装饰 -->
    <div class="ribbon">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- 标题行 -->
    <div class="title-row">
      <h1>生日快乐</h1>
      <span class="friend-name">渊</span>
    </div>

    <!-- 祝福语 -->
    <div class="message">
      <p>
        <i>🎉</i> 愿你的每一天都充满阳光与欢笑，<br>
        愿所有美好都如期而至，<br>
        愿你成为自己喜欢的样子，<br>
        祝你明媚<br>
        祝你熠熠生辉 <i>🎂</i>
      </p>
    </div>

    <!-- 蛋糕 + 吹蜡烛互动区 -->
    <div class="cake-section">
      <div class="cake" id="cake" title="点击吹蜡烛！">
        <div class="cake-base"></div>
        <div class="cake-mid"></div>
        <div class="cake-top"></div>
        <div class="sprinkles">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="candle" id="candle">
          <div class="flame" id="flame"></div>
        </div>
      </div>
      <div class="hint" id="hint">👆 点击蛋糕或蜡烛吹灭它</div>
    </div>

    <!-- 按钮区 -->
    <div class="action-buttons">
      <button class="btn" id="celebrateBtn">🎉 撒花庆祝</button>
      <button class="btn btn-music" id="musicBtn">🎵 播放生日快乐歌</button>
    </div>

    <!-- 底部小字 -->
    <div class="footer-note">
      ⭐ 永远开心，永远闪耀 ⭐
    </div>
  </div>

  <script>
    (function() {
      // ---------- 1. 飘浮爱心（移动端精简到 14 个） ----------
      const heartContainer = document.getElementById('heartContainer');
      const heartSymbols = ['❤️', '💖', '✨', '⭐', '🎈'];
      const HEART_COUNT = 14;
      const isMobile = window.matchMedia('(max-width: 600px)').matches;
      const finalCount = isMobile ? 10 : HEART_COUNT;

      for (let i = 0; i < finalCount; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.top = Math.random() * 100 + '%';
        heart.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
        heart.style.animationDelay = Math.random() * 12 + 's';
        heart.style.animationDuration = (10 + Math.random() * 6) + 's';
        heartContainer.appendChild(heart);
      }

      // ---------- 2. 元素引用 ----------
      const candle = document.getElementById('candle');
      const flame = document.getElementById('flame');
      const cake = document.getElementById('cake');
      const hint = document.getElementById('hint');
      const celebrateBtn = document.getElementById('celebrateBtn');
      const musicBtn = document.getElementById('musicBtn');

      let isCandleLit = true;

      // ---------- 3. 吹蜡烛 ----------
      function blowOutCandle() {
        if (!isCandleLit) return;
        flame.classList.add('hidden');
        candle.classList.add('extinguished');
        isCandleLit = false;
        hint.textContent = '🎂 蜡烛吹灭啦！愿望一定会实现 ✨';
        createConfetti(isMobile ? 12 : 20);
      }

      cake.addEventListener('click', blowOutCandle);
      candle.addEventListener('click', (e) => {
        e.stopPropagation();
        blowOutCandle();
      });

      // ---------- 4. 撒花 ----------
      function createConfetti(count) {
        const colors = ['#ff9aa2', '#ffb7b2', '#ffdac1', '#e2f0cb', '#b5ead7', '#c7ceea', '#ff99cc', '#ffcc00'];
        const container = document.body;
        const finalCount = isMobile ? Math.min(count, 25) : count;

        for (let i = 0; i < finalCount; i++) {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          const color = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.backgroundColor = color;
          confetti.style.left = Math.random() * 100 + '%';
          confetti.style.width = (5 + Math.random() * 6) + 'px';
          confetti.style.height = (5 + Math.random() * 6) + 'px';
          confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
          confetti.style.animationDelay = Math.random() * 0.3 + 's';
          container.appendChild(confetti);
          setTimeout(() => confetti.remove(), 3500);
        }
      }

      // ---------- 5. 撒花庆祝按钮 ----------
      celebrateBtn.addEventListener('click', function() {
        createConfetti(isMobile ? 25 : 50);
        if (isCandleLit) {
          hint.textContent = '🎈 点击蛋糕吹蜡烛吧';
        } else {
          hint.textContent = '🎊 生日快乐！！！🎊';
        }
        celebrateBtn.style.transform = 'scale(1.08)';
        setTimeout(() => celebrateBtn.style.transform = 'scale(1)', 150);
      });

      // ---------- 6. 播放生日快乐歌（Web Audio 合成） ----------
      let audioCtx = null;
      let isPlaying = false;
      let stopTimeout = null;

      function stopMusic() {
        if (stopTimeout) {
          clearTimeout(stopTimeout);
          stopTimeout = null;
        }
        if (audioCtx) {
          audioCtx.close().catch(() => {});
          audioCtx = null;
        }
        isPlaying = false;
        musicBtn.classList.remove('playing');
        musicBtn.textContent = '🎵 播放生日快乐歌';
      }

      function playNote(frequency, startTime, duration, gainNode) {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = frequency;
        osc.connect(gainNode);
        osc.start(startTime);
        osc.stop(startTime + duration);
      }

      const melody = [
        { note: 392.00, dur: 0.75 }, { note: 392.00, dur: 0.25 },
        { note: 440.00, dur: 1.0 }, { note: 392.00, dur: 1.0 },
        { note: 523.25, dur: 1.0 }, { note: 493.88, dur: 2.0 },
        { note: 392.00, dur: 0.75 }, { note: 392.00, dur: 0.25 },
        { note: 440.00, dur: 1.0 }, { note: 392.00, dur: 1.0 },
        { note: 587.33, dur: 1.0 }, { note: 523.25, dur: 2.0 },
        { note: 392.00, dur: 0.75 }, { note: 392.00, dur: 0.25 },
        { note: 783.99, dur: 1.0 }, { note: 659.25, dur: 1.0 },
        { note: 523.25, dur: 1.0 }, { note: 493.88, dur: 1.0 },
        { note: 440.00, dur: 1.0 },
        { note: 698.46, dur: 0.75 }, { note: 698.46, dur: 0.25 },
        { note: 659.25, dur: 1.0 }, { note: 523.25, dur: 1.0 },
        { note: 587.33, dur: 1.0 }, { note: 523.25, dur: 2.0 }
      ];

      function playHappyBirthday() {
        stopMusic();

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.22;
        gainNode.connect(audioCtx.destination);

        const startTime = audioCtx.currentTime + 0.1;
        let currentTime = startTime;
        const totalDuration = melody.reduce((sum, item) => sum + item.dur, 0);

        melody.forEach((item) => {
          playNote(item.note, currentTime, item.dur * 0.9, gainNode);
          currentTime += item.dur;
        });

        isPlaying = true;
        musicBtn.classList.add('playing');
        musicBtn.textContent = '🎶 播放中...';

        stopTimeout = setTimeout(() => {
          if (audioCtx) {
            audioCtx.close().catch(() => {});
            audioCtx = null;
          }
          isPlaying = false;
          musicBtn.classList.remove('playing');
          musicBtn.textContent = '🎵 播放生日快乐歌';
        }, (totalDuration + 0.5) * 1000);

        hint.textContent = '🎵 生日快乐歌为你奏响 🎵';
      }

      musicBtn.addEventListener('click', function() {
        if (isPlaying) {
          stopMusic();
          hint.textContent = '🎵 音乐已停止';
        } else {
          playHappyBirthday();
          createConfetti(isMobile ? 8 : 15);
        }
      });

      // ---------- 7. 双击重置蜡烛 ----------
      cake.addEventListener('dblclick', function(e) {
        e.stopPropagation();
        if (!isCandleLit) {
          flame.classList.remove('hidden');
          candle.classList.remove('extinguished');
          isCandleLit = true;
          hint.textContent = '🕯️ 蜡烛重新点燃啦，再吹一次吧~';
        }
      });

      // 页面隐藏时停止音乐（节省电量和性能）
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && isPlaying) {
          stopMusic();
        }
      });
    })();
  </script>
</body>
</html>
